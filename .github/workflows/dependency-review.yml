# Bloqueia a entrada de dependencia vulneravel ou com licenca incompativel.
name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  revisao:
    name: Revisar dependencias do pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Licencas incompativeis com uso comercial fechado.
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0
